name: Multi-Frame Confluence Scan

on:
  schedule:
    - cron: '0 14 * * 1-5'   # Mon-Fri 14:00 UTC = 10:00 ET (mid-morning)
    - cron: '0 17 * * 1-5'   # Mon-Fri 17:00 UTC = 13:00 ET (early afternoon)
    - cron: '0 20 * * 1-5'   # Mon-Fri 20:00 UTC = 16:00 ET (market close)
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install yfinance pandas numpy requests

      - name: Run multi-frame confluence scan
        env:
          RESEND_API_KEY:  ${{ secrets.RESEND_API_KEY }}
          SUBSCRIBERS:     ${{ secrets.SUBSCRIBERS }}
          NEWSLETTER_TO:   ${{ secrets.NEWSLETTER_TO }}
        run: python internal_multiframe_scan.py --alert
